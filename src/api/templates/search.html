<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한국 식품 데이터 검색</title>
  <style>
    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: linear-gradient(160deg, #e8f5ec, #f7fbf8);
      min-height: 100vh;
      color: #062513;
    }

    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }

    h1 { text-align: center; color: #1b4d2e; }

    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 1.2rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      margin-bottom: 1.4rem;
    }

    .search-bar input, .search-bar select {
      flex: 1 1 220px;
      padding: 0.8rem;
      border-radius: 10px;
      border: 1px solid #b8d8c2;
      font-size: 1rem;
    }

    .search-bar button, .search-bar a {
      padding: 0.8rem 1.6rem;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: #3fb074;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    th, td { padding: 0.9rem 1rem; text-align: left; }

    th { background: #1b4d2e; color: #fff; font-weight: 600; }

    tr:nth-child(even) td { background: #f3faf4; }
    tr:hover td { background: #e0f2e5; }

    .empty {
      text-align: center;
      padding: 2rem;
      font-style: italic;
      color: #4d6b58;
    }
  </style>
</head>
<body>
  <div class="layout">
    <h1>🥗 한국 식품 영양 데이터</h1>
    <form class="search-bar" method="get" action="/search">
      <input type="text" name="q" placeholder="식품명을 입력하세요 (예: 김치, 닭가슴살)" value="{{ query }}">
      <select name="sort">
        {% for col, label in columns %}
          <option value="{{ col }}" {% if sort_by == col %}selected{% endif %}>{{ label }} 순</option>
        {% endfor %}
      </select>
      <button type="submit">검색</button>
      <a href="/recommend">추천 화면으로</a>
    </form>

    {% if rows %}
      <table>
        <thead>
          <tr>
            {% for _, label in columns %}
              <th>{{ label }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
            <tr>
              {% for col, _ in columns %}
                <td>{{ row[col] }}</td>
              {% endfor %}
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <div class="card empty">
        데이터를 불러오지 못했거나 검색 조건에 맞는 결과가 없습니다.
      </div>
    {% endif %}
  </div>
</body>
</html>
