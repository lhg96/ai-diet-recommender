<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}세종시 스마트시티 식단 추천{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.teal-green.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
        <header class="mdl-layout__header">
            <div class="mdl-layout__header-row">
                <span class="mdl-layout-title">세종시 스마트시티 식단 추천</span>
                <div class="mdl-layout-spacer"></div>
                <nav class="mdl-navigation mdl-layout--large-screen-only">
                    <a class="mdl-navigation__link" href="/">홈</a>
                    <a class="mdl-navigation__link" href="/recommend">추천받기</a>
                    <a class="mdl-navigation__link" href="/stats">통계</a>
                    <a class="mdl-navigation__link" href="/about">소개</a>
                </nav>
            </div>
        </header>
        <div class="mdl-layout__drawer">
            <span class="mdl-layout-title">메뉴</span>
            <nav class="mdl-navigation">
                <a class="mdl-navigation__link" href="/"><i class="material-icons">home</i> 홈</a>
                <a class="mdl-navigation__link" href="/recommend"><i class="material-icons">restaurant_menu</i> 추천받기</a>
                <a class="mdl-navigation__link" href="/stats"><i class="material-icons">bar_chart</i> 통계</a>
                <a class="mdl-navigation__link" href="/about"><i class="material-icons">info</i> 소개</a>
            </nav>
        </div>
        <main class="mdl-layout__content">
            {% block content %}
            {% endblock %}
            <footer class="mdl-mini-footer">
                <div class="mdl-mini-footer__left-section">
                    <div class="mdl-logo">세종시 스마트시티 식단 추천 시스템</div>
                    <ul class="mdl-mini-footer__link-list">
                        <li><a href="#">도움말</a></li>
                        <li><a href="#">개인정보처리방침</a></li>
                    </ul>
                </div>
            </footer>
        </main>
    </div>
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>
</body>
</html>
